<!DOCTYPE html>

<style>
* {

body {

.app {

header {

header h1 {

}

.search {

}

.list-item span:last-child {

</head>

<body>

<div class="app">

<div class="controls">

</div>

<div class="list" id="list"></div>

<footer>

</footer>

</div>

let current = 0;

function showEffect(index) {
  current = (index + effects.length) % effects.length;
  const e = effects[current];

  document.getElementById("card").innerHTML = `
    <div class="category">${e.category}</div>
    <div class="number">${String(current + 1).padStart(3,"0")} / ${effects.length}</div>
    <h2>${e.name}</h2>

    <div class="summary">
      ${e.summary}
    </div>

    <div class="section">
      <h3>WHAT</h3>
      <p>${e.what}</p>
    </div>

    <div class="section">
      <h3>EXAMPLE</h3>
      <div class="example">
        ${e.example}
      </div>
    </div>

    <div class="section">
      <h3>WHY</h3>
      <p>${e.why}</p>
    </div>
  `;

  renderList();
}

function nextEffect() {
  showEffect(current + 1);
}

function prevEffect() {
  showEffect(current - 1);
}

function randomEffect() {
  let next;

  do {
    next = Math.floor(Math.random() * effects.length);
  } while (next === current && effects.length > 1);

  showEffect(next);
}

function renderList(data = effects) {
  const list = document.getElementById("list");

  list.innerHTML = data.map(e => {
    const index = effects.indexOf(e);

    return `
      <div class="list-item" onclick="showEffect(${index})">
        <span>
          ${String(index + 1).padStart(3,"0")}　${e.name}
        </span>
        <span>${e.category}</span>
      </div>
    `;
  }).join("");
}

function searchEffects() {
  const keyword =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  if (!keyword) {
    renderList();
    return;
  }

  const result = effects.filter(e =>
    e.name.toLowerCase().includes(keyword) ||
    e.category.toLowerCase().includes(keyword) ||
    e.summary.toLowerCase().includes(keyword) ||
    e.what.toLowerCase().includes(keyword) ||
    e.example.toLowerCase().includes(keyword) ||
    e.why.toLowerCase().includes(keyword)
  );

  renderList(result);
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextEffect();
  if (e.key === "ArrowLeft") prevEffect();
});

showEffect(0);
// スマホのスワイプ操作
let startX = 0;

document.getElementById("card").addEventListener("touchstart", function(e) {
  startX = e.touches[0].clientX;
}, { passive: true });

document.getElementById("card").addEventListener("touchend", function(e) {
  const endX = e.changedTouches[0].clientX;
  const distance = endX - startX;

  if (Math.abs(distance) > 50) {
    if (distance < 0) {
      nextEffect();
    } else {
      prevEffect();
    }
  }
}, { passive: true });
  
</script>
